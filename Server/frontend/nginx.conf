server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:9001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /docs { proxy_pass http://backend:9001/docs; proxy_http_version 1.1; }
  location /openapi.json { proxy_pass http://backend:9001/openapi.json; }
  location /health {
    proxy_pass http://backend:9001/health;
    proxy_http_version 1.1;
  }
  location /socket.io/ {
    proxy_pass http://backend:9001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
